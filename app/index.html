"buttons"><button type="button" class="small" id="cancel">取消</button><button class="primary" type="submit">保存任务</button></div></form></dialog><script>
'use strict';
const KEY='pixel-day-v1';const day=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const pool=[['整理桌面上的一个小角落','整理'],['读几页自己喜欢的书','学习'],['看看窗外，找一种喜欢的颜色','观察'],['给自己留一句鼓励的话','放松'],['听一首喜欢的歌','放松'],['整理手机里三张不需要的截图','整理'],['记下今天一件开心的小事','放松'],['认识一个新的词语','学习'],['观察身边物品的影子','观察'],['画一个不需要完美的小图案','放松'],['整理一个常用文件夹','整理'],['了解一种植物的名字','观察'],['读一首短诗','学习'],['给明天的自己留一个小提示','整理'],['安静休息三分钟','放松'],['留意身边一种柔和的声音','观察']];
let state={version:1,tasks:[],days:{},logs:[],excluded:[]},storageOK=true;try{const raw=localStorage.getItem(KEY);if(raw){const s=JSON.parse(raw);if(s.version!==1||!Array.isArray(s.tasks)||!s.days||!Array.isArray(s.logs)||!Array.isArray(s.excluded))throw Error();state=s}}catch(e){storageOK=false}
let page='today',editing=null,timer;const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const uid=()=>globalThis.crypto?.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2);
function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');clearTimeout(timer);timer=setTimeout(()=>$('toast').classList.add('hidden'),2700)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));storageOK=true}catch(e){storageOK=false;toast('无法保存到浏览器，请导出备份后继续。')}}
function daily(){return state.days[day()]||(state.days[day()]={random:[],bonus:null,initialized:false})}
function done(t){return state.logs.some(l=>l.id===t.id&&(t.repeat==='once'?true:l.date===day()))}
function due(t){if(t.date&&t.date>day())return false;if(t.repeat==='weekly'&&t.date)return new Date(t.date+'T12:00:00').getDay()===new Date(day()+'T12:00:00').getDay();return true}
function choose(bonus=false){const d=daily();const used=[...d.random,d.bonus].filter(Boolean).map(t=>t.title);const options=pool.filter(([title,category])=>!used.includes(title)&&!state.excluded.includes(category));if(!options.length)return null;const [title,category]=options[Math.floor(Math.random()*options.length)];return {id:uid(),title,category,points:bonus?20:10,repeat:'daily',source:'random'}}
function ensure(){const d=daily();if(!d.initialized){if(!state.tasks.some(t=>due(t)&&(!done(t)||state.logs.some(l=>l.id===t.id&&l.date===day())))){for(let i=0;i<3;i++){const t=choose();if(t)d.random.push(t)}}d.bonus=choose(true);d.initialized=true;save()}}
function taskRow(t,manage=false){const complete=done(t);return '<div class="task '+(complete?'done':'')+'"><div class="reward">'+(complete?'✓':'+'+(t.points||10))+'</div><div class="task-body"><div class="task-title">'+esc(t.title)+'</div><div class="task-meta">'+(t.source==='random'?esc(t.category)+' · 今日推荐':esc(t.date||'未安排日期')+' · '+({once:'我的待办',daily:'每天重复',weekly:'每周重复'}[t.repeat]||'我的待办'))+'</div></div><div class="task-actions">'+(manage?'<button class="small" data-edit="'+t.id+'" aria-label="编辑 '+esc(t.title)+'">编辑</button>':'')+'<button class="complete" data-toggle="'+t.id+'" aria-label="'+(complete?'撤销完成 ':'完成 ')+esc(t.title)+'" aria-pressed="'+complete+'">'+(complete?'✓':'')+'</button>'+(manage?'<button class="delete" data-delete="'+t.id+'" aria-label="删除 '+esc(t.title)+'">×</button>':'')+'</div></div>'}
function heading(title,action=''){return '<div class="panel-heading"><h2>'+title+'</h2>'+action+'</div>'}
function render(){ensure();$('date').textContent=day().replaceAll('-','/');document.querySelectorAll('[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('page-title').textContent={today:'今日任务',todos:'我的待办',growth:'成长记录',settings:'我的设置'}[page];$('fortune').textContent='幸运词： '+['小小的行动，也会开出花','今天也要好好照顾自己','不着急，你有自己的时区','允许自己，慢慢来'][new Date().getDate()%4];const d=daily(),total=state.logs.reduce((a,l)=>a+l.points,0);const meta='<div class="headmeta"><span>✦ 今天，也是全新的一关</span><span class="badge">★ '+total+' 积分</span></div>';
if(page==='today'){const own=state.tasks.filter(t=>due(t)&&(!done(t)||state.logs.some(l=>l.id===t.id&&l.date===day())));const list=[...own,...d.random];const count=list.filter(done).length;$('content').innerHTML=meta+'<section class="panel">'+heading('常规任务：','<button class="small" data-add>＋ 添加任务</button>')+'<p class="subtitle">'+(own.length?'自己的安排，永远排在前面。':'没有安排？从一件轻松的小事开始。')+'</p>'+list.map(t=>taskRow(t)).join('')+(!list.length?'<div class="empty">今天留一点空白，也很好。<br>添加待办，或领取一份小灵感。</div>':'')+'<div class="panel-footer"><span class="hint">已完成 '+count+' / '+list.length+' · 不必全部做完</span><button class="small" data-recommend>＋ 再推荐一个</button></div></section><section class="panel bonus">'+heading('彩蛋任务：<small>（选做）</small>','<button class="small" data-swap '+(d.bonus&&done(d.bonus)?'disabled':'')+'>↻ 换一个</button>')+(d.bonus?taskRow(d.bonus):'<div class="empty">暂时没有符合偏好的推荐</div>')+'</section>'}
if(page==='todos'){const open=state.tasks.filter(t=>!done(t)),closed=state.tasks.filter(done);$('content').innerHTML=meta+'<section class="panel">'+heading('自己的小目标','<button class="primary" data-add>＋ 新建</button>')+'<p class="subtitle">今日和未安排的任务优先出现在首页，未来任务留到那一天。</p>'+(open.length?open.map(t=>taskRow(t,true)).join(''):'<div class="empty">还没有待办事项。<br>把脑海里的小计划，放到这里吧。</div>')+(closed.length?'<h3>已完成 · '+closed.length+'</h3>'+closed.map(t=>taskRow(t,true)).join(''):'')+'</section>'}
if(page==='growth'){const todayLogs=state.logs.filter(l=>l.date===day());const dates=[...new Set(state.logs.map(l=>l.date))].sort().reverse();$('content').innerHTML=meta+'<section class="panel">'+heading('每一步，都算数')+'<div class="stats"><div class="stat"><strong>'+total+'</strong><span>累计积分</span></div><div class="stat"><strong>'+state.logs.length+'</strong><span>完成任务</span></div><div class="stat"><strong>'+dates.length+'</strong><span>行动天数</span></div></div><p>LV.'+(Math.floor(total/100)+1)+' · 生活小冒险家</p><div class="progress"><div style="width:'+total%100+'%"></div></div><p class="hint">距离下一级还有 '+(100-total%100)+' 积分 · 今日获得 '+todayLogs.reduce((a,l)=>a+l.points,0)+' 积分</p></section><section class="panel">'+heading('收集的小小成就')+(dates.length?dates.map(date=>'<h3 class="history-day">'+date.replaceAll('-','/')+'</h3>'+state.logs.filter(l=>l.date===date).map(l=>'<div class="history-item"><span>✓ '+esc(l.title)+'</span><span>+'+l.points+'</span></div>').join('')).join(''):'<div class="empty">第一颗星星，正在等你点亮。<br>完成一个任务，就会记录在这里。</div>')+'</section>'}
if(page==='settings'){$('content').innerHTML=meta+'<section class="panel">'+heading('让推荐更懂你')+'<p class="settings-copy">选择愿意接收的任务类型。更改会用于下一次推荐，不会删除已领取的任务。</p>'+['整理','学习','观察','放松'].map(c=>'<label><input style="width:auto;margin-right:12px" type="checkbox" data-category="'+c+'" '+(!state.excluded.includes(c)?'checked':'')+'>'+c+'</label>').join('')+'</section><section class="panel">'+heading('你的数据，你保管')+'<p class="settings-copy"><strong>当前为本地体验版，不含云端同步。</strong><br>数据保存在当前浏览器。电脑和手机可以使用，但暂不互通。清理浏览器数据可能丢失记录，建议定期导出。</p><p class="hint">存储状态：'+(storageOK?'可用':'不可用或已有数据格式异常，请先备份')+'</p><button class="primary outline" data-export>↓ 导出备份</button> <button class="small" data-import>导入备份</button><input id="import-file" type="file" accept="application/json,.json" hidden><hr style="border:0;border-top:2px solid #ffe2d4;margin:24px 0"><button class="small" data-clear>清空本机数据</button></section>'}}
function findTask(id){const d=daily();return [...state.tasks,...d.random,d.bonus].filter(Boolean).find(t=>t.id===id)}
function openEditor(id){editing=id||null;const t=id?findTask(id):null;$('editor-title').textContent=t?'编辑这个小目标':'＋ 添加一个小目标';$('task-title').value=t?.title||'';$('task-date').value=t?t.date:day();$('task-repeat').value=t?.repeat||'once';$('editor').showModal();$('task-title').focus()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;render();return}if(b.hasAttribute('data-add'))openEditor();if(b.dataset.edit)openEditor(b.dataset.edit);if(b.dataset.toggle){const t=findTask(b.dataset.toggle);if(!t)return;if(done(t)){state.logs=state.logs.filter(l=>!(l.id===t.id&&(t.repeat==='once'||l.date===day())));toast('已撤销完成，积分同步扣回')}else{state.logs.push({id:t.id,title:t.title,date:day(),points:t.points||10});toast('✦ 完成啦！ +'+(t.points||10)+' 积分')}save();render()}if(b.dataset.delete&&confirm('删除这个待办？已经获得的历史积分会保留。')){state.tasks=state.tasks.filter(t=>t.id!==b.dataset.delete);save();render()}if(b.hasAttribute('data-recommend')){const t=choose();if(t){daily().random.push(t);save();render();toast('收到一份新的生活灵感')}else toast('可推荐的任务已领完，可调整偏好')}if(b.hasAttribute('data-swap')){const t=choose(true);if(t){daily().bonus=t;save();render()}else toast('暂无其他符合偏好的任务')}if(b.hasAttribute('data-export')){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='pixel-day-'+day()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}if(b.hasAttribute('data-import'))$('import-file').click();if(b.hasAttribute('data-clear')&&confirm('确定清空本机所有任务、积分和记录？此操作不可撤销，请先导出备份。')){state={version:1,tasks:[],days:{},logs:[],excluded:[]};save();render();toast('本机数据已清空')}});
$('cancel').onclick=()=>$('editor').close();$('task-form').onsubmit=e=>{e.preventDefault();const title=$('task-title').value.trim(),date=$('task-date').value,repeat=$('task-repeat').value;if(!title){$('task-title').setCustomValidity('请输入任务内容');$('task-title').reportValidity();return}if(repeat==='weekly'&&!date){toast('每周重复需要选择开始日期');return}if(editing){const t=findTask(editing);Object.assign(t,{title,date,repeat})}else state.tasks.push({id:uid(),title,date,repeat,points:10,source:'custom'});save();$('editor').close();render();toast('已保存，你的小目标准备好了')};$('task-title').oninput=()=>$('task-title').setCustomValidity('');
document.addEventListener('change',async e=>{if(e.target.dataset.category){const c=e.target.dataset.category;state.excluded=state.excluded.filter(x=>x!==c);if(!e.target.checked)state.excluded.push(c);save()}if(e.target.id==='import-file'){const file=e.target.files[0];if(!file)return;try{if(file.size>5e6)throw Error();const s=JSON.parse(await file.text());const validTask=t=>t&&typeof t.id==='string'&&/^[\w-]+$/.test(t.id)&&typeof t.title==='string'&&t.title.length<=100&&['once','daily','weekly'].includes(t.repeat)&&[10,20].includes(t.points);if(s.version!==1||!Array.isArray(s.tasks)||!s.tasks.every(validTask)||!Array.isArray(s.logs)||!s.logs.every(l=>l&&typeof l.id==='string'&&typeof l.title==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(l.date)&&[10,20].includes(l.points))||!s.days||typeof s.days!=='object'||!Object.entries(s.days).every(([k,v])=>/^\d{4}-\d{2}-\d{2}$/.test(k)&&v&&Array.isArray(v.random)&&v.random.every(validTask)&&(!v.bonus||validTask(v.bonus)))||!Array.isArray(s.excluded)||!s.excluded.every(c=>['整理','学习','观察','放松'].includes(c)))throw Error();if(confirm('导入会替换当前数据，确定继续？')){state=s;save();render();toast('备份已恢复')}}catch(err){toast('无法导入：请选择有效的像素日常备份文件')}}});
window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{const s=JSON.parse(e.newValue);if(s.version===1){state=s;render()}}catch{}}});document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});render();
</script><script src="pwa.js"></script></body></html>
